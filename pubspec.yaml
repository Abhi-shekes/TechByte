name: techbyte
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.3+4

environment:
  sdk: ^3.9.2

dependencies:
  cloud_firestore: ^6.8.0
  collection: ^1.19.1
  drift: ^2.29.0
  firebase_ai: ^3.15.0
  firebase_analytics: ^12.4.6
  firebase_app_check: ^0.4.6
  firebase_auth: ^6.5.7
  firebase_core: ^4.13.0
  firebase_crashlytics: ^5.2.7
  firebase_messaging: ^16.5.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^20.1.0
  flutter_riverpod: ^3.3.2
  go_router: ^17.2.3
  google_fonts: ^8.1.0
  google_sign_in: ^7.2.0
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  shared_preferences: ^2.5.5
  sqlite3: ^2.9.4
  sqlite3_flutter_libs: ^0.5.42
  timezone: ^0.10.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.29.0
  build_runner: ^2.7.1
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    # Content packs, discovered at runtime by QuestionPack. Declared as a
    # directory so adding a pack needs no pubspec change.
    - assets/content/
