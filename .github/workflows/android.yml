name: Android CI

# Android only, by product requirement. There is deliberately no iOS job.
#
# This workflow only verifies the code (analyze, test, debug build). It never
# publishes anything. The signed release build lives in release.yml and fires
# separately when a dev -> main PR is merged.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.35.7'

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Content packs are plain assets, so a malformed one does not fail the
      # build — the on-device validator just drops the bad entries and the
      # corpus silently shrinks. Here is the only place that shows up.
      # No install step: tools/content has no dependencies.
      - name: Validate content packs
        working-directory: tools/content
        run: |
          node --test
          node validate.mjs

      - name: Install dependencies
        run: flutter pub get

      # Drift's generated database code is not committed, so it has to be
      # regenerated before anything can compile.
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --reporter=expanded

  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # google-services.json is not in the repository. CI reconstructs it from
      # a base64 secret so the Firebase Gradle plugin can run; without it the
      # build fails at configuration time.
      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not set."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json

      - name: Build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: techbyte-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
