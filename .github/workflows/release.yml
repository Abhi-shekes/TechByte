name: Release

# Fires when the dev -> main PR is merged (not on every PR merged into main,
# and not on direct pushes to main). Also runnable by hand for a re-run after
# fixing a secret, via workflow_dispatch.
#
# What it does, in order:
#   1. Bump the patch version and build number in pubspec.yaml.
#   2. Build a signed release APK and AAB.
#   3. Rename them to techbyte-v<version>-<buildNumber>-release.{apk,aab}.
#   4. Commit the version bump back to main and tag it.
#   5. Create a GitHub Release with both files attached.
#
# Requires these repository secrets (Settings -> Secrets and variables ->
# Actions), none of which exist yet on a fresh repo:
#   GOOGLE_SERVICES_JSON      base64 of android/app/google-services.json
#   RELEASE_KEYSTORE_BASE64   base64 of the release .jks keystore
#   RELEASE_KEYSTORE_PASSWORD
#   RELEASE_KEY_ALIAS
#   RELEASE_KEY_PASSWORD
#
# Create the keystore with tools/create_release_keystore.sh, then:
#   base64 -w0 ~/techbyte-release.jks
#
# Also requires Settings -> Actions -> General -> Workflow permissions =
# "Read and write permissions", so the workflow can push the version-bump
# commit and tag to main. If main has branch protection, add an exception
# (or a bypass rule) for github-actions[bot], otherwise the push step fails.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.35.7'

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'dev')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure release bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # versionName's patch digit and versionCode (the build number after the
      # '+') both auto-increment. pubspec.yaml is the single source of truth —
      # `flutter build` reads it to set the Android versionName/versionCode,
      # so no android/app/build.gradle.kts change is needed.
      - name: Bump version
        id: version
        run: |
          set -euo pipefail
          CURRENT=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version: *//')
          VERSION_NAME="${CURRENT%%+*}"
          BUILD_NUMBER="${CURRENT##*+}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          NEW_PATCH=$((PATCH + 1))
          NEW_BUILD=$((BUILD_NUMBER + 1))
          NEW_VERSION_NAME="${MAJOR}.${MINOR}.${NEW_PATCH}"
          NEW_VERSION="${NEW_VERSION_NAME}+${NEW_BUILD}"
          sed -i "s/^version: .*/version: ${NEW_VERSION}/" pubspec.yaml
          echo "Bumped ${CURRENT} -> ${NEW_VERSION}"
          echo "version_name=${NEW_VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "build_number=${NEW_BUILD}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW_VERSION_NAME}+${NEW_BUILD}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not set."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set. Create a keystore with tools/create_release_keystore.sh, then 'base64 -w0 <keystore>' it into this secret."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/techbyte-release.jks

      - name: Write signing config
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "::error::One or more signing secrets are missing: RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD."
            exit 1
          fi
          cat > android/key.properties <<EOF
          storePassword=${RELEASE_KEYSTORE_PASSWORD}
          keyPassword=${RELEASE_KEY_PASSWORD}
          keyAlias=${RELEASE_KEY_ALIAS}
          storeFile=app/techbyte-release.jks
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Rename artifacts
        id: artifacts
        run: |
          set -euo pipefail
          APK_NAME="techbyte-v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.build_number }}-release.apk"
          AAB_NAME="techbyte-v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.build_number }}-release.aab"
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk "release-artifacts/${APK_NAME}"
          cp build/app/outputs/bundle/release/app-release.aab "release-artifacts/${AAB_NAME}"
          echo "apk_path=release-artifacts/${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "aab_path=release-artifacts/${AAB_NAME}" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git add pubspec.yaml
          git commit -m "chore(release): bump version to ${{ steps.version.outputs.tag }} [skip ci]"
          git push origin HEAD:main

      - name: Tag release
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: TechByte ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.artifacts.outputs.apk_path }}
            ${{ steps.artifacts.outputs.aab_path }}
